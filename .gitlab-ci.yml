variables:
  BUILD_TYPE: Release

stages:
  - build

workflow:
  rules:
    - if: $CI_COMMIT_TAG
      when: never
    - if: $CI_PIPELINE_SOURCE == "push"
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"

# Template for Windows
.windows_build:
  stage: build
  tags:
    - saas-windows-medium-amd64
  before_script:
    - powershell -Command "Install-WindowsFeature Server-Media-Foundation"
    - choco install -y vcredist140
    - powershell -Command "Register-PackageSource -ProviderName NuGet -Name nugetRepository -Location https://www.nuget.org/api/v2 -Force"
    - powershell -Command "Install-Package Microsoft.Web.WebView2 -Scope CurrentUser -RequiredVersion 1.0.3485.44 -Source nugetRepository -Force"

build-windows-x64:
  extends: .windows_build
  script:
    - cmake -S . -B build -G "Visual Studio 17 2022" -A x64
    - cmake --build build --config $env:BUILD_TYPE --parallel
  artifacts:
    name: "OrbitLooper-Windows-x64-$CI_COMMIT_REF_SLUG"
    paths:
      - build/OrbitLooper_artefacts/$env:BUILD_TYPE/VST3/
      - build/OrbitLooper_artefacts/$env:BUILD_TYPE/Standalone/

build-windows-arm64:
  extends: .windows_build
  script:
    - |
      $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
      $vsPath = & $vswhere -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
      if (!$vsPath) { $vsPath = & $vswhere -latest -property installationPath }
      $installer = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\setup.exe"
      if (Test-Path $installer) {
        Write-Host "Installing ARM64 MSVC tools..."
        Start-Process -FilePath $installer -ArgumentList "modify --installPath `"$vsPath`" --add Microsoft.VisualStudio.Component.VC.Tools.ARM64 --quiet --norestart" -Wait -NoNewWindow
      } else {
        Write-Warning "Visual Studio Installer not found at $installer"
      }
    - cmake -S . -B build -G "Visual Studio 17 2022" -A ARM64 -DCMAKE_SYSTEM_PROCESSOR=arm64
    - cmake --build build --config $env:BUILD_TYPE --parallel
  artifacts:
    name: "OrbitLooper-Windows-ARM64-$CI_COMMIT_REF_SLUG"
    paths:
      - build/OrbitLooper_artefacts/$env:BUILD_TYPE/VST3/
      - build/OrbitLooper_artefacts/$env:BUILD_TYPE/Standalone/

