variables:
  BUILD_TYPE: Release

stages:
  - build

workflow:
  rules:
    - if: $CI_COMMIT_TAG
      when: never
    - if: $CI_PIPELINE_SOURCE == "push"
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"

# ─────────────────────────────────────────────────────────────────────────────
# Windows builds are disabled on GitLab CI.
# GitLab SaaS Windows runners use Server Core which lacks GUI DLLs
# (dcomp.dll, d2d1.dll, d3d11.dll) required by JUCE's juceaide tool.
# Windows builds run on GitHub Actions instead (full Windows runners).
# ─────────────────────────────────────────────────────────────────────────────

# build-macos:
#   Disabled — no macOS runners available on GitLab SaaS free tier.
#   macOS builds run on GitHub Actions.

build-linux-x64:
  stage: build
  image: ubuntu:latest
  tags:
    - saas-linux-medium-amd64
  before_script:
    - apt-get update && apt-get install -y build-essential cmake git libasound2-dev libjack-jackd2-dev libfreetype6-dev libx11-dev libxrandr-dev libxinerama-dev libxcursor-dev libxcomposite-dev mesa-common-dev libglu1-mesa-dev libwebkit2gtk-4.1-dev libgtk-3-dev libcurl4-openssl-dev xvfb
  script:
    - cmake -S . -B build -DCMAKE_BUILD_TYPE=$BUILD_TYPE
    - NO_AT_BRIDGE=1 LIBGL_ALWAYS_SOFTWARE=1 xvfb-run -a cmake --build build --target OrbitLooper_VST3 -j$(nproc)
    - NO_AT_BRIDGE=1 LIBGL_ALWAYS_SOFTWARE=1 xvfb-run -a cmake --build build --target OrbitLooper_LV2 -j$(nproc)
    - NO_AT_BRIDGE=1 LIBGL_ALWAYS_SOFTWARE=1 xvfb-run -a cmake --build build --target OrbitLooper_Standalone -j$(nproc)
  artifacts:
    name: "OrbitLooper-Linux-x64-$CI_COMMIT_REF_SLUG"
    paths:
      - build/OrbitLooper_artefacts/$BUILD_TYPE/VST3/
      - build/OrbitLooper_artefacts/$BUILD_TYPE/LV2/
      - build/OrbitLooper_artefacts/$BUILD_TYPE/Standalone/

build-linux-arm64:
  stage: build
  image: ubuntu:24.04
  tags:
    - saas-linux-small-arm64
  before_script:
    - apt-get update && apt-get install -y build-essential cmake git libasound2-dev libjack-jackd2-dev libfreetype6-dev libx11-dev libxrandr-dev libxinerama-dev libxcursor-dev libxcomposite-dev mesa-common-dev libglu1-mesa-dev libwebkit2gtk-4.1-dev libgtk-3-dev libcurl4-openssl-dev xvfb
  script:
    - cmake -S . -B build -DCMAKE_BUILD_TYPE=$BUILD_TYPE
    - NO_AT_BRIDGE=1 GDK_BACKEND=x11 LIBGL_ALWAYS_SOFTWARE=1 xvfb-run -a cmake --build build --target OrbitLooper_VST3 -j2
    - NO_AT_BRIDGE=1 GDK_BACKEND=x11 LIBGL_ALWAYS_SOFTWARE=1 xvfb-run -a cmake --build build --target OrbitLooper_LV2 -j2
    - NO_AT_BRIDGE=1 GDK_BACKEND=x11 LIBGL_ALWAYS_SOFTWARE=1 xvfb-run -a cmake --build build --target OrbitLooper_Standalone -j2
  artifacts:
    name: "OrbitLooper-Linux-ARM64-$CI_COMMIT_REF_SLUG"
    paths:
      - build/OrbitLooper_artefacts/$BUILD_TYPE/VST3/
      - build/OrbitLooper_artefacts/$BUILD_TYPE/LV2/
      - build/OrbitLooper_artefacts/$BUILD_TYPE/Standalone/

build-android:
  stage: build
  image: eclipse-temurin:17-jdk
  tags:
    - saas-linux-medium-amd64
  before_script:
    - apt-get update && apt-get install -y build-essential cmake git unzip wget pkg-config
      libasound2-dev libfreetype6-dev libx11-dev libxrandr-dev libxinerama-dev
      libxcursor-dev libxcomposite-dev mesa-common-dev libglu1-mesa-dev
      libwebkit2gtk-4.1-dev libgtk-3-dev libcurl4-openssl-dev
    # Install Android SDK
    - mkdir -p /opt/android-sdk/cmdline-tools
    - wget -q https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip -O /tmp/cmdline-tools.zip
    - unzip -q /tmp/cmdline-tools.zip -d /opt/android-sdk/cmdline-tools
    - mv /opt/android-sdk/cmdline-tools/cmdline-tools /opt/android-sdk/cmdline-tools/latest
    - export ANDROID_HOME=/opt/android-sdk
    - export PATH=$ANDROID_HOME/cmdline-tools/latest/bin:$ANDROID_HOME/platform-tools:$PATH
    - yes | sdkmanager --licenses || true
    - sdkmanager "platforms;android-35" "ndk;28.1.13356709" "build-tools;35.0.0"
  script:
    # Desktop configure — fetches JUCE source + builds juceaide for host
    - cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
    # Build APK — use system Gradle directly instead of the wrapper
    # (gradle-wrapper.jar in repo may be corrupted by git CRLF conversion)
    - |
      GRADLE_VER="8.11.1"
      GRADLE_DIR="/opt/gradle"
      mkdir -p "$GRADLE_DIR"
      wget -q "https://services.gradle.org/distributions/gradle-${GRADLE_VER}-bin.zip" -O /tmp/gradle.zip
      unzip -qo /tmp/gradle.zip -d "$GRADLE_DIR"
      export PATH="$GRADLE_DIR/gradle-${GRADLE_VER}/bin:$PATH"
      export ANDROID_HOME=/opt/android-sdk
      cd android
      gradle assembleRelease_Release
  artifacts:
    name: "OrbitLooper-Android-arm64-$CI_COMMIT_REF_SLUG"
    paths:
      - android/app/build/outputs/apk/release_/release/OrbitLooper.apk
